name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # jemalloc is default for Linux wheels; include it in linting
      - run: cargo clippy --all-targets --features "parallel,cli,jemalloc" -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --no-default-features --features "parallel,cli"
      - run: cargo test --no-default-features --lib

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read rust-version from Cargo.toml
        run: |
          msrv=$(grep -m1 '^rust-version' Cargo.toml | sed -E 's/^rust-version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')
          echo "MSRV=$msrv" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.MSRV }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo check --features "parallel,cli,jemalloc"

  # ── Dependency auditing ────────────────────────────────────────────
  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features
          rust-version: stable

  audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # ── Code coverage ──────────────────────────────────────────────────
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin
      - name: Run tarpaulin
        run: |
          cargo tarpaulin \
            --no-default-features \
            --features "parallel,cli,jemalloc" \
            --out xml html \
            --output-dir coverage \
            --skip-clean \
            --timeout 300 \
            --exclude-files "tests/perf_budget*" \
            --implicit-test-threads \
            -- --skip perf_budget
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          file: coverage/cobertura.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage/

  bench-compile:
    name: Benchmarks compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo bench --no-run --features "bench,parallel,jemalloc"

  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [fuzz_lex, fuzz_parse, fuzz_execute]
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
        env:
          RUSTFLAGS: ""
      - name: Seed the corpus with the parity fixtures
        run: |
          mkdir -p corpus
          for d in fixtures/parity/*/; do
            n=$(basename "$d")
            if [ "$TARGET" = fuzz_execute ]; then
              # The fuzz_execute input is the grammar, a NUL byte and the text.
              { cat "$d/syntax1.gel"; printf '\0'; cat "$d/input1.txt"; } > "corpus/$n"
            else
              cp "$d/syntax1.gel" "corpus/$n"
            fi
          done
      - name: Fuzz for 60 seconds
        working-directory: fuzz
        run: cargo fuzz run "$TARGET" ../corpus -- -max_total_time=60

  # ── Profile-Guided Optimization validation ─────────────────────────
  pgo:
    name: PGO validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install llvm-profdata
        run: |
          # Find the llvm-profdata binary shipped with the toolchain
          PROFDATA=$(find $(rustc --print sysroot) -name llvm-profdata -type f | head -1)
          echo "PROFDATA=$PROFDATA" >> "$GITHUB_ENV"
      - name: Build with instrumentation
        env:
          RUSTFLAGS: -Cprofile-generate=/tmp/pgo-data
        run: cargo build --release --no-default-features --features "parallel,cli,jemalloc"
      - name: Collect profile data
        run: |
          # Run the test suite against the instrumented build to generate profile data
          # perf_budget is skipped (as in coverage): wall-clock budgets don't hold for instrumented builds.
          RUSTFLAGS="-Cprofile-generate=/tmp/pgo-data" \
            cargo test --release --no-default-features --features "parallel,cli,jemalloc" \
            -- --skip perf_budget
      - name: Merge profiles
        run: ${{ env.PROFDATA }} merge -o /tmp/merged.profdata /tmp/pgo-data
      - name: Rebuild with PGO
        env:
          RUSTFLAGS: -Cprofile-use=/tmp/merged.profdata
        run: cargo build --release --no-default-features --features "parallel,cli,jemalloc"

  python:
    name: Python integration (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install maturin
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install maturin pyyaml
      - name: Build and install wheel
        run: |
          source .venv/bin/activate
          maturin develop --features "python,jemalloc"
      - name: Python tests
        run: |
          source .venv/bin/activate
          for t in tests/python/test_*.py; do python "$t"; done
