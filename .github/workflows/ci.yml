name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # jemalloc is default for Linux wheels; include it in linting
      - run: cargo clippy --all-targets --features "parallel,cli,mmap,jemalloc" -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --no-default-features --features "parallel,cli,mmap"
      - run: cargo test --no-default-features --lib

  # ── Dependency auditing ────────────────────────────────────────────
  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features
          rust-version: stable
          version: 0.14.20

  audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # ── Code coverage ──────────────────────────────────────────────────
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin
      - name: Run tarpaulin
        run: |
          cargo tarpaulin \
            --no-default-features \
            --features "parallel,cli,mmap,jemalloc" \
            --out xml html \
            --output-dir coverage \
            --skip-clean \
            --timeout 300 \
            --exclude-files "tests/perf_budget*"
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          file: coverage/cobertura.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  bench-compile:
    name: Benchmarks compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench --no-run --features "bench,parallel,mmap,jemalloc"

  # ── Profile-Guided Optimization validation ─────────────────────────
  pgo:
    name: PGO validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install llvm-profdata
        run: |
          # Find the llvm-profdata binary shipped with the toolchain
          PROFDATA=$(find $(rustc --print sysroot) -name llvm-profdata -type f | head -1)
          echo "PROFDATA=$PROFDATA" >> "$GITHUB_ENV"
      - name: Build with instrumentation
        env:
          RUSTFLAGS: -Cprofile-generate=/tmp/pgo-data
        run: cargo build --release --no-default-features --features "parallel,cli,mmap,jemalloc"
      - name: Collect profile data
        run: |
          # Run the test suite against the instrumented build to generate profile data
          RUSTFLAGS="-Cprofile-generate=/tmp/pgo-data" \
            cargo test --release --no-default-features --features "parallel,cli,mmap,jemalloc"
      - name: Merge profiles
        run: ${{ env.PROFDATA }} merge -o /tmp/merged.profdata /tmp/pgo-data
      - name: Rebuild with PGO
        env:
          RUSTFLAGS: -Cprofile-use=/tmp/merged.profdata
        run: cargo build --release --no-default-features --features "parallel,cli,mmap,jemalloc"

  python:
    name: Python integration (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install maturin
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install maturin
      - name: Build and install wheel
        run: |
          source .venv/bin/activate
          maturin develop --features "python,jemalloc"
      - name: Smoke test import
        run: |
          source .venv/bin/activate
          python -c "from Rustine import rustine; print('Rustine imported successfully')"
          python -c "import gelatin; print('Gelatin compat shim imported successfully')"
