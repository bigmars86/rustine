name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to re-release (e.g. v0.1.1)"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # ── Gate: full CI checks before building ───────────────────────────
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --all-targets --features "parallel,cli,jemalloc" -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        # With the allocator of the wheels for that platform.
        include:
          - { os: ubuntu-latest, features: "parallel,cli,jemalloc" }
          - { os: macos-latest, features: "parallel,cli" }
          - { os: windows-latest, features: "parallel,cli,mimalloc" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --no-default-features --features "$FEATURES"
        shell: bash
        env:
          FEATURES: ${{ matrix.features }}

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features
          rust-version: stable

  audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  python:
    name: Python smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build and run the Python tests
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install maturin pyyaml
          maturin develop --features "python,jemalloc"
          for t in tests/python/test_*.py; do python "$t"; done

  # ── Gate: the tag must match the package version ──────────────────
  version-guard:
    name: Verify tag matches version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag must equal Cargo.toml [package] version
        run: |
          pkg_version=$(grep -m1 '^version' Cargo.toml | sed -E 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')
          echo "Cargo.toml version : $pkg_version"
          echo "Release tag        : ${RELEASE_TAG}"
          if [ "v${pkg_version}" != "${RELEASE_TAG}" ]; then
            echo "::error::Tag ${RELEASE_TAG} does not match Cargo.toml version v${pkg_version}. Bump Cargo.toml or retag."
            exit 1
          fi

  # ── Build wheels for each platform ─────────────────────────
  build:
    name: Build (${{ matrix.target }})
    needs: [fmt, clippy, test, deny, audit, python, version-guard]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (glibc) — jemalloc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            features: "python,jemalloc"
            manylinux: auto
          # Linux x86_64 (musl — Alpine / Docker) — jemalloc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            features: "python,jemalloc"
            manylinux: musllinux_1_2
          # Linux aarch64 (glibc) — jemalloc
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            features: "python,jemalloc"
            manylinux: auto
          # Linux aarch64 (musl — Alpine / Docker) — jemalloc
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            features: "python,jemalloc"
            manylinux: musllinux_1_2
          # Linux i686 (32-bit glibc)
          - os: ubuntu-latest
            target: i686-unknown-linux-gnu
            features: "python,jemalloc"
            manylinux: auto
          # macOS x86_64 (macos-14 is arm64 but can cross-compile)
          - os: macos-14
            target: x86_64-apple-darwin
            features: python
            manylinux: auto
          # macOS Apple Silicon
          - os: macos-latest
            target: aarch64-apple-darwin
            features: python
            manylinux: auto
          # Windows x86_64 — mimalloc
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            features: "python,mimalloc"
            manylinux: auto
          # Windows i686 (32-bit) — mimalloc
          - os: windows-latest
            target: i686-pc-windows-msvc
            features: "python,mimalloc"
            manylinux: auto

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --features ${{ matrix.features }}
          manylinux: ${{ matrix.manylinux }}

      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.target }}
          path: dist/

  # ── Gate: install and test the built wheels ─────────────────────────
  wheel-test:
    name: Test wheel (${{ matrix.artifact }}, Python ${{ matrix.python }})
    needs: [build]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, artifact: wheels-x86_64-unknown-linux-gnu, python: "3.11" }
          - { os: ubuntu-latest, artifact: wheels-x86_64-unknown-linux-gnu, python: "3.15" }
          - { os: windows-latest, artifact: wheels-x86_64-pc-windows-msvc, python: "3.13" }
          - { os: macos-latest, artifact: wheels-aarch64-apple-darwin, python: "3.13" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            tests/python
            fixtures/parity
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.artifact }}
          path: dist/
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install the wheel and run the Python tests
        shell: bash
        run: |
          python -m pip install pyyaml
          python -m pip install --no-index --find-links dist rustine
          # Outside the checkout, so Python imports the installed package.
          cd "$RUNNER_TEMP"
          for t in "$GITHUB_WORKSPACE"/tests/python/test_*.py; do python "$t"; done

  wheel-test-musl:
    name: Test wheel (x86_64 musl, Alpine)
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            tests/python
            fixtures/parity
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels-x86_64-unknown-linux-musl
          path: dist/
      - name: Install the wheel and run the Python tests in Alpine
        run: |
          docker run --rm -v "$PWD:/w:ro" python:3.13-alpine sh -euc '
            pip install -q pyyaml
            pip install -q --no-index --find-links /w/dist rustine
            cd /tmp
            for t in /w/tests/python/test_*.py; do python "$t"; done'

  # ── Build sdist ────────────────────────────────────────────────────
  sdist:
    name: Source distribution
    needs: [fmt, clippy, test, deny, audit, python, version-guard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-sdist
          path: dist/

  # ── Publish to PyPI ────────────────────────────────────────────────
  publish-pypi:
    name: Publish to PyPI
    needs: [build, wheel-test, wheel-test-musl, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/rustine
    permissions:
      id-token: write          # OIDC for trusted publishing
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true
        # Uses trusted publishing (OIDC) — no API token needed.
        # Configure at https://pypi.org/manage/project/rustine/settings/publishing/

  # ── Publish to crates.io ───────────────────────────────────────────
  publish-crate:
    name: Publish to crates.io
    needs: [build, wheel-test, wheel-test-musl, sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Publish unless this version is already on crates.io
        run: |
          version="${RELEASE_TAG#v}"
          status=$(curl -s -o /dev/null -w '%{http_code}' -A 'rustine-release (https://github.com/bigmars86/rustine)' \
            "https://crates.io/api/v1/crates/rustine/${version}")
          if [ "$status" = 200 ]; then
            echo "rustine ${version} is already on crates.io"
          else
            cargo publish --no-default-features --features "parallel,cli"
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

  # ── GitHub Release ─────────────────────────────────────────────────
  github-release:
    name: GitHub Release
    needs: [build, wheel-test, wheel-test-musl, sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write          # create the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0       # full history needed for git-cliff

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/

      - name: Generate changelog for this release
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        id: cliff
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: CHANGES.md
          files: dist/*

  # ── Update CHANGELOG.md in main after release ─────────────────────
  changelog:
    name: Update CHANGELOG.md
    needs: [github-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main

      - name: Generate full changelog
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: --output CHANGELOG.md

      - name: Commit and push CHANGELOG.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --cached --quiet && exit 0
          git commit -m "docs: update CHANGELOG.md for ${{ env.RELEASE_TAG }}"
          git push
