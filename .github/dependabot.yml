# Dependabot configuration
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # Rust (Cargo) dependencies
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "build(deps):"
    labels:
      - dependencies
      - rust
    open-pull-requests-limit: 10

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci(deps):"
    labels:
      - dependencies
      - ci

  # Python (pip) — for docs/requirements.txt
  - package-ecosystem: pip
    directory: /docs
    schedule:
      interval: monthly
    commit-message:
      prefix: "docs(deps):"
    labels:
      - dependencies
      - documentation
