# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[graph]
# All features that should be considered during checks.
all-features = false
features = ["parallel", "cli", "mmap"]

# ── Licenses ─────────────────────────────────────────────────────────
[licenses]
# This project is dual-licensed MIT OR Apache-2.0.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
]
confidence-threshold = 0.8

# ── Bans ─────────────────────────────────────────────────────────────
[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

# ── Advisories ───────────────────────────────────────────────────────
[advisories]
# Uses the RustSec advisory database.
# Will fail CI on any dependency with a known vulnerability.
version = 2
ignore = []

# ── Sources ──────────────────────────────────────────────────────────
[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
