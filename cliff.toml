# git-cliff configuration
# https://git-cliff.org/docs/configuration
#
# Generates CHANGELOG.md from conventional commits.
# Run locally:  git cliff -o CHANGELOG.md
# Run for tag:  git cliff --latest -o CHANGELOG.md

[changelog]
# Header prepended to the generated changelog.
header = """# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""

# Body template for each release section.
# https://keats.github.io/tera/docs/#introduction
body = """
{%- macro remote_url() -%}
  https://github.com/bigmars86/rustine
{%- endmacro -%}

{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}

{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}\
  {% if commit.breaking %} (**BREAKING**){% endif %}\
  ([{{ commit.id | truncate(length=7, end="") }}]({{ self::remote_url() }}/commit/{{ commit.id }}))
{%- endfor %}
{% endfor %}
"""

# Remove leading/trailing whitespace from the template output.
trim = true

# Footer appended to the generated changelog.
footer = ""

[git]
# Parse conventional commits.
# https://www.conventionalcommits.org
conventional_commits = true

# Filter out commits that don't match conventional commit format.
filter_unconventional = true

# Process each line of a commit as an individual commit.
split_commits = false

# Regex for preprocessing commit messages.
commit_preprocessors = [
  # Remove issue numbers from commit messages.
  { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "" },
]

# Map conventional commit types to Keep a Changelog sections.
commit_parsers = [
  { message = "^feat",     group = "<!-- 0 -->Added" },
  { message = "^fix",      group = "<!-- 1 -->Fixed" },
  { message = "^perf",     group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Changed" },
  { message = "^doc",      group = "<!-- 4 -->Documentation" },
  { message = "^style",    group = "<!-- 5 -->Styling" },
  { message = "^test",     group = "<!-- 6 -->Testing" },
  { message = "^ci",       group = "<!-- 7 -->CI/CD" },
  { message = "^build",    group = "<!-- 7 -->CI/CD" },
  { message = "^chore",    group = "<!-- 8 -->Miscellaneous" },
  { message = "^revert",   group = "<!-- 9 -->Reverted" },
  # Skip merge commits and dependabot.
  { message = "^Merge",       skip = true },
  { message = "^dependabot",  skip = true },
]

# Protect breaking changes from being skipped by a parser above.
protect_breaking_commits = true

# Filter out commits by their tags.
filter_commits = false

# Glob pattern for matching git tags.
tag_pattern = "v[0-9].*"

# Sort commits inside sections by oldest first.
sort_commits = "oldest"
